<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A responsive calculator with keyboard support and arithmetic operations.">
  <title>Orbit — Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-symbol">◎</span> orbit<span class="brand-period">.</span></a>
      <span class="top-label">EVERYDAY CALCULATOR</span>
    </header>
    <section class="calculator-wrap">
      <div class="heading">
        <p class="eyebrow">SIMPLE TOOLS / 001</p>
        <h1>Numbers,<br><span>made simple.</span></h1>
        <p class="subtitle">A clean space for quick calculations.</p>
      </div>
      <div class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite">
          <div class="display-label">DISPLAY</div>
          <div class="expression" id="expression">0</div>
          <div class="result" id="result">0</div>
        </div>
        <div class="keypad">
          <button class="key utility" data-action="clear">AC</button>
          <button class="key utility" data-action="delete" aria-label="Delete last character">⌫</button>
          <button class="key utility" data-action="percent">%</button>
          <button class="key operator" data-value="÷">÷</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key operator" data-value="×">×</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key operator" data-value="−">−</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key operator" data-value="+">+</button>

          <button class="key utility" data-action="sign">+/−</button>
          <button class="key" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key equals" data-action="equals">=</button>
        </div>
        <p class="keyboard-hint">KEYBOARD ENABLED <span>•</span> Enter = result&nbsp; / &nbsp;Esc = clear</p>
      </div>
    </section>
    <footer><span>ORBIT CALCULATOR</span><span>Designed for clarity.</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
